<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stackly Magazine - Signup</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* ================= RESET ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

/* ================= BODY ================= */
body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
overflow-x:hidden;
}

/* BACKGROUND SLIDER */
.bg-slider{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
display:flex;
animation:slide 16s infinite;
}

.bg-slider img{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(0.5);
}

@keyframes slide{
0%{transform:translateX(0);}
25%{transform:translateX(-100%);}
50%{transform:translateX(-200%);}
75%{transform:translateX(-300%);}
100%{transform:translateX(0);}
}

/* ================= WRAPPER ================= */
.wrapper{
width:92%;
max-width:1000px;
display:flex;
border-radius:20px;
overflow:hidden;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

/* ================= LEFT ================= */
.left{
flex:1;
padding:30px;
color:#fff;
display:flex;
flex-direction:column;
justify-content:center;
}

/* TOP BAR */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.home-btn{
color:#fff;
text-decoration:none;
background:rgba(255,255,255,0.1);
padding:6px 10px;
border-radius:6px;
font-size:14px;
}

/* TITLE */
h1{
font-size:26px;
}

h2{
font-size:14px;
opacity:0.8;
margin-bottom:20px;
}

/* INPUT */
.input-box{
margin:10px 0;
position:relative;
}

.input-box input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
outline:none;
background:rgba(255,255,255,0.15);
color:#fff;
}

/* EYE ICON */
.eye{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

/* BUTTON */
button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#ff6b35;
color:#fff;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ff4d1a;
transform:scale(1.03);
}

/* ERROR */
#error{
color:#ffb3b3;
font-size:13px;
margin-top:10px;
}

/* SOCIAL */
.social button{
margin-top:8px;
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.2);
}

/* ================= RIGHT IMAGE ================= */
.right{
flex:1;
position:relative;
overflow:hidden;
}

.right img{
width:100%;
height:100%;
object-fit:cover;
}

/* OVERLAY */
.overlay{
position:absolute;
bottom:20px;
left:20px;
background:rgba(0,0,0,0.4);
padding:10px;
border-radius:10px;
color:#fff;
backdrop-filter:blur(10px);
}

/* ================= RESPONSIVE ================= */
@media(max-width:900px){
.wrapper{
flex-direction:column;
}

.right{
height:250px;
}
}

@media(max-width:500px){
.left{
padding:20px;
}

h1{
font-size:22px;
}

h2{
font-size:12px;
}
}
/* LOGIN LINK */

.login-link{
    text-align:center;
    margin-top:15px;
    margin-bottom:10px;
    color:#fff;
    font-size:14px;
}

.login-link a{
    color:#ff6b35;
    text-decoration:none;
    font-weight:600;
    margin-left:5px;
    transition:0.3s;
}

.login-link a:hover{
    color:#ff8c42;
    text-decoration:underline;
}

/* MOBILE */
@media(max-width:500px){

    .login-link{
        font-size:13px;
    }

}
/* STACKLY LOGO */

.stackly-logo{
    position:absolute;
    top:20px;
    left:20px;
    z-index:100;
    display:block;
}

.stackly-logo img{
    width:120px;
    height:auto;
    display:block;
    transition:0.3s ease;
}

.stackly-logo img:hover{
    transform:scale(1.05);
}

/* TABLET */
@media(max-width:900px){

    .stackly-logo img{
        width:100px;
    }

}

/* MOBILE */
@media(max-width:500px){

    .stackly-logo{
        top:12px;
        left:12px;
    }

    .stackly-logo img{
        width:80px;
    }

}
</style>
</head>

<body>

<!-- BACKGROUND SLIDER -->
<div class="bg-slider">
    <img src="./pizza.webp">
    <img src="./burger.webp">
    <img src="./beverages.webp">
    <img src="./veg1.webp">
</div>

<div class="wrapper">

<!-- LEFT -->
<div class="left">

<div class="top-bar">
<a href="index.html" class="home-btn"><i class="fa fa-home"></i> Home</a>
</div>

<h1>Create Account 🍕</h1>
<h2>Join Food Ordering App</h2>

<div class="input-box">
<input type="text" id="name" placeholder="Full Name">
</div>

<div class="input-box">
<input type="email" id="email" placeholder="Email">
</div>

<div class="input-box">
<input type="password" id="password" placeholder="Password">
<i class="fa-solid fa-eye eye" onclick="togglePassword('password')"></i>
</div>

<div class="input-box">
<input type="password" id="confirm" placeholder="Confirm Password">
<i class="fa-solid fa-eye eye" onclick="togglePassword('confirm')"></i>
</div>

<button onclick="signup()">Sign Up</button>

<div class="login-link">
    Already have an account?
    <a href="./login.html">Login</a>
</div>

<p id="error"></p>




<div class="social">
<button onclick="go404()"><i class="fab fa-google"></i> Google</button>
<button onclick="go404()"><i class="fab fa-apple"></i> Apple</button>
</div>

</div>

<!-- RIGHT -->
<!-- RIGHT -->
<div class="right">

    <!-- STACKLY LOGO -->
    <a href="./index.html" class="stackly-logo">
        <img src="./white.webp" alt="Stackly Logo">
    </a>

    <img src="./burger.webp" alt="Burger">

    <div class="overlay">
        <h3>Fresh Food Delivered</h3>
        <p>Hot & tasty meals at your door</p>
    </div>

</div>
</div>

</div>

<script>

/* PASSWORD TOGGLE */
function togglePassword(id){
let input=document.getElementById(id);
input.type = input.type==="password" ? "text" : "password";
}

/* VALIDATION */
function signup(){

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let pass=document.getElementById("password").value.trim();
let confirm=document.getElementById("confirm").value.trim();
let error=document.getElementById("error");

if(name==="" || email==="" || pass==="" || confirm===""){
error.innerText="⚠️ Please fill all details";
return;
}

if(pass!==confirm){
error.innerText="⚠️ Passwords do not match";
return;
}

window.location.href="404.html";
}

/* SOCIAL */
function go404(){
window.location.href="404.html";
}

</script>

</body>
</html>
