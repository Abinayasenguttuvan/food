<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stackly food delivery - Login</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* ================= RESET ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

/* ================= BODY ================= */
body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#000;
overflow:hidden;
}

/* BACKGROUND SLIDER */
.bg-slider{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
display:flex;
animation:slide 16s infinite;
}

.bg-slider img{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(0.5);
}

@keyframes slide{
0%{transform:translateX(0);}
25%{transform:translateX(-100%);}
50%{transform:translateX(-200%);}
75%{transform:translateX(-300%);}
100%{transform:translateX(0);}
}

/* ================= WRAPPER ================= */
.wrapper{
width:92%;
max-width:1000px;
display:flex;
border-radius:20px;
overflow:hidden;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
box-shadow:0 20px 60px rgba(0,0,0,0.5);
}

/* ================= LEFT ================= */
.left{
flex:1;
padding:30px;
color:#fff;
display:flex;
flex-direction:column;
justify-content:center;
}

/* TOP */
.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.home-btn{
color:#fff;
text-decoration:none;
font-size:14px;
background:rgba(255,255,255,0.1);
padding:6px 10px;
border-radius:6px;
}

/* TITLE */
h1{
font-size:28px;
}

h2{
font-size:14px;
opacity:0.8;
margin-bottom:20px;
}

/* INPUTS */
.input-box{
margin:10px 0;
position:relative;
}

.input-box input{
width:100%;
padding:12px;
border:none;
border-radius:8px;
outline:none;
background:rgba(255,255,255,0.15);
color:#fff;
}

.eye{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
}

/* BUTTON */
button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#ff6b35;
color:#fff;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ff4d1a;
transform:scale(1.03);
}

/* ERROR */
#error{
color:#ffb3b3;
font-size:13px;
margin-top:10px;
}

/* SOCIAL */
.social button{
margin-top:8px;
background:rgba(255,255,255,0.1);
border:1px solid rgba(255,255,255,0.2);
}

/* ================= RIGHT IMAGE PANEL ================= */
.right{
flex:1;
position:relative;
overflow:hidden;
}

.right img{
width:100%;
height:100%;
object-fit:cover;
}

/* OVERLAY */
.overlay{
position:absolute;
bottom:20px;
left:20px;
background:rgba(0,0,0,0.4);
padding:10px;
border-radius:10px;
color:#fff;
backdrop-filter:blur(10px);
}

/* ================= RESPONSIVE ================= */
@media(max-width:900px){
.wrapper{
flex-direction:column;
}

.right{
height:250px;
}
}

@media(max-width:500px){
.left{
padding:20px;
}

h1{
font-size:22px;
}

h2{
font-size:12px;
}
}
/* FORGOT PASSWORD & SIGNUP */

.auth-links{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:15px;
margin-bottom:15px;
}

.auth-links a{
color:#fff;
text-decoration:none;
font-size:14px;
transition:0.3s;
}

.auth-links a:hover{
color:#ff6b35;
text-decoration:underline;
}

/* MOBILE */
@media(max-width:500px){

.auth-links{
flex-direction:column;
gap:10px;
align-items:flex-start;
}

.auth-links a{
font-size:13px;
}

}
/* STACKLY LOGO */

.login-logo{
    position:absolute;
    top:20px;
    left:20px;
    z-index:10;
    display:block;
}

.login-logo img{
    width:120px;
    height:auto;
    display:block;
    transition:0.3s ease;
}

.login-logo img:hover{
    transform:scale(1.05);
}

/* TABLET */
@media(max-width:900px){

    .login-logo img{
        width:100px;
    }
}

/* MOBILE */
@media(max-width:500px){

    .login-logo{
        top:15px;
        left:15px;
    }

    .login-logo img{
        width:80px;
    }
}
/* STACKLY LOGO */

.login-logo{
    position:absolute;
    top:20px;
    left:20px;
    z-index:10;
    display:block;
}

.login-logo img{
    width:120px;
    height:auto;
    display:block;
    transition:0.3s ease;
}

.login-logo img:hover{
    transform:scale(1.05);
}

/* TABLET */
@media(max-width:900px){

    .login-logo img{
        width:100px;
    }
}

/* MOBILE */
@media(max-width:500px){

    .login-logo{
        top:15px;
        left:15px;
    }

    .login-logo img{
        width:80px;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND SLIDER -->
<div class="bg-slider">
<img src="./pizza.webp">
<img src="./burger.webp">
<img src="./beverages.webp">
<img src="./veg1.webp">
</div>

<div class="wrapper">

<!-- LEFT -->
<div class="left">
  

<div class="top-bar">
<a href="index.html" class="home-btn"><i class="fa fa-home"></i> Home</a>
</div>

<h1>Welcome Back 🍔</h1>
<h2>Login to Food Ordering App</h2>

<div class="input-box">
<input type="email" id="email" placeholder="Enter Email">
</div>

<div class="input-box">
<input type="password" id="password" placeholder="Enter Password">
<i class="fa-solid fa-eye eye" onclick="togglePassword()"></i>
</div>


<button onclick="login()">Login</button>

<div class="auth-links">
    <a href="./404.html">Forgot Password?</a>
    <a href="./signup.html">Sign Up</a>
</div>

<p id="error"></p>

<p id="error"></p>

<div class="social">
  <button onclick="go404()">
    <i class="fab fa-google"></i> Google
  </button>
  
  <button onclick="go404()">
    <i class="fab fa-apple"></i> Apple
  </button>
</div>

</div>

  <script>
function go404(){
  window.location.href = "404.html";
}
</script>



  
<!-- RIGHT -->
<div class="right">

  <!-- STACKLY LOGO -->
  <a href="./index.html" class="login-logo">
      <img src="./white.webp" alt="Stackly Logo">
  </a>

  <img src="./burger.webp" alt="Burger">

  <div class="overlay">
      <h3>Fresh Food Delivered</h3>
      <p>Hot & tasty meals at your door</p>
  </div>

</div>
</div>

<script>

/* PASSWORD */
function togglePassword(){
let pass=document.getElementById("password");
pass.type = pass.type === "password" ? "text" : "password";
}

/* LOGIN VALIDATION */
function login(){

let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value.trim();
let error=document.getElementById("error");

if(email==="" || password===""){
error.innerText="⚠️ Please fill all details";
return;
}

window.location.href="404.html";
}

</script>

</body>
</html>
